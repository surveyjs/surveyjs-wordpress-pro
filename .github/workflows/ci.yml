name: CI

on:
  pull_request:
  push:
    branches: [master, base-pro-split]
  workflow_dispatch:
    inputs:
      base-ref:
        description: Base (surveyjs-wordpress) branch, tag or SHA; empty = branch with the same name, else NEIGHBOR_FALLBACK_REF
        required: false
  workflow_call:
    inputs:
      base-ref:
        type: string
        default: ""
      release-version:
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build zips
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: base
        env:
          INPUT_BASE_REF: ${{ inputs.base-ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          FALLBACK: ${{ vars.NEIGHBOR_FALLBACK_REF || 'base-pro-split' }}
        run: |
          ref="$INPUT_BASE_REF"
          if [ -z "$ref" ]; then
            ref="$FALLBACK"
            if git ls-remote --exit-code --heads https://github.com/surveyjs/surveyjs-wordpress.git "refs/heads/$BRANCH" > /dev/null; then
              ref="$BRANCH"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: surveyjs/surveyjs-wordpress
          ref: ${{ steps.base.outputs.ref }}
          path: base
          persist-credentials: false
      - env:
          RELEASE_VERSION: ${{ inputs.release-version }}
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          version="$(sed -nE 's/^Version:[[:space:]]*([^[:space:]]+).*/\1/p' surveyjs-pro.php)"
          if [ -n "$RELEASE_VERSION" ] && [ "$version" != "$RELEASE_VERSION" ]; then
            echo "::error file=surveyjs-pro.php::Version is $version, the release is $RELEASE_VERSION"
            exit 1
          fi
          node scripts/build.js --base-ref HEAD --base-repo base --out dist
          unzip -q "dist/surveyjs-pro-$version.zip" -d dist
          unzip -q "dist/surveyjs-forms-vip-$version.zip" -d dist/vip
          COMPOSER_ROOT_VERSION="$version" composer validate --no-check-lock
          echo "Base: $BASE_REF ($(git -C base rev-parse HEAD))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: dist/
          retention-days: ${{ inputs.release-version && 90 || 7 }}
          if-no-files-found: error

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=unit

  checks:
    name: Checks
    needs: build
    uses: surveyjs/surveyjs-wordpress/.github/workflows/checks.yml@base-pro-split
    with:
      php-paths: dist/surveyjs-pro dist/vip/client-mu-plugins
      plugin-check-dir: dist/surveyjs-pro
      plugin-check-ignore-codes: |
        plugin_header_invalid_license
        invalid_license
        plugin_updater_detected
      e2e-base-dir: dist/vip/plugins/surveyjs
      e2e-pro-dir: dist/surveyjs-pro
