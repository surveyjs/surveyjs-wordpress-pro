name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, x.y.z (the tag is created after the checks)
        required: true
      base-ref:
        description: Base ref to build and test against; empty = Base tag with the same version (required to publish)
        required: false
      publish:
        description: Publish the GitHub release (creates the tag, Packagist picks it up) and upload the zips to cdn.surveyjs.io; each step waits for approval
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  PUBLISH: ${{ inputs.publish && vars.RELEASE_PUBLISH_ENABLED == 'true' }}

jobs:
  verify:
    name: Release fields and Base tag
    if: github.repository == 'surveyjs/surveyjs-wordpress-pro'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base-ref: ${{ steps.check.outputs.base-ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          BASE_REF: ${{ inputs.base-ref || inputs.version }}
        run: |
          fail=0
          need() { grep -qF -- "$2" "$1" || { echo "::error file=$1::\"$2\" not found"; fail=1; }; }
          need surveyjs-pro.php "'SURVEYJS_PRO_MIN_BASE_VERSION', '$VERSION'"
          need surveyjs-pro.php "'SURVEYJS_PRO_LIBRARY_VERSION', '$VERSION'"
          need composer.json "\"wp-plugin/surveyjs\": \"$VERSION\""
          for package in survey-core survey-creator-core survey-creator-js survey-js-ui; do
            need package.json "\"$package\": \"$VERSION\""
          done
          need readme.txt "= $VERSION ="
          if [ "$BASE_REF" != "$VERSION" ] && [ "$PUBLISH" = true ]; then
            echo "::error::Publishing needs Pro built against Base tag $VERSION, not $BASE_REF"
            fail=1
          fi
          if [ "$BASE_REF" = "$VERSION" ] && ! git ls-remote --exit-code --tags https://github.com/surveyjs/surveyjs-wordpress.git "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Base tag $VERSION does not exist yet: release Base first, or pass base-ref for a dry run"
            fail=1
          fi
          echo "base-ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          exit "$fail"

  ci:
    name: Checks
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      base-ref: ${{ needs.verify.outputs.base-ref }}
      release-version: ${{ inputs.version }}

  github-release:
    name: GitHub Release
    needs: ci
    permissions:
      contents: write
    uses: surveyjs/surveyjs-wordpress/.github/workflows/github-release.yml@base-pro-split
    with:
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish && vars.RELEASE_PUBLISH_ENABLED == 'true' }}

  cdn:
    name: Upload zips to cdn.surveyjs.io
    needs: github-release
    if: inputs.publish && vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    environment:
      name: cdn
      url: https://cdn.surveyjs.io/${{ vars.AZURE_BLOB_CONTAINER || 'wordpress' }}/surveyjs-pro.zip
    env:
      STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT || 'surveyjsdocsstorage' }}
      CONTAINER: ${{ vars.AZURE_BLOB_CONTAINER || 'wordpress' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: ${{ runner.temp }}/dist
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - working-directory: ${{ runner.temp }}/dist
        run: |
          upload() {
            az storage blob upload --auth-mode login --account-name "$STORAGE_ACCOUNT" --container-name "$CONTAINER" \
              --file "$1" --name "$2" --content-type application/zip --overwrite --only-show-errors
          }
          upload "surveyjs-pro-$VERSION.zip" "surveyjs-pro-$VERSION.zip"
          upload "surveyjs-forms-vip-$VERSION.zip" "surveyjs-forms-vip-$VERSION.zip"
          upload "surveyjs-pro-$VERSION.zip" surveyjs-pro.zip
          upload "surveyjs-forms-vip-$VERSION.zip" surveyjs-forms-vip.zip
      - run: |
          az afd endpoint purge \
            --resource-group "${{ vars.AZURE_FRONT_DOOR_RESOURCE_GROUP || 'SurveyJS' }}" \
            --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE || 'surveyjs-docs' }}" \
            --endpoint-name "${{ vars.AZURE_FRONT_DOOR_ENDPOINT || 'surveyjs-docs-cdn' }}" \
            --domains cdn.surveyjs.io \
            --content-paths "/$CONTAINER/surveyjs-pro.zip" "/$CONTAINER/surveyjs-forms-vip.zip"

  packagist:
    name: Packagist
    needs: github-release
    if: inputs.publish && vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: packagist
    steps:
      - env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -n "$PACKAGIST_API_TOKEN" ]; then
            curl -fsS -X POST -H "Content-Type: application/json" \
              "https://packagist.org/api/update-package?username=$PACKAGIST_USERNAME&apiToken=$PACKAGIST_API_TOKEN" \
              -d "{\"repository\":{\"url\":\"https://github.com/$GITHUB_REPOSITORY\"}}" || echo "::warning::update-package failed, waiting for the GitHub webhook"
          fi
          for attempt in $(seq 40); do
            if curl -fsS "https://repo.packagist.org/p2/surveyjs/surveyjs-pro.json?t=$attempt" | grep -qF "\"version\":\"$VERSION\""; then
              echo "surveyjs/surveyjs-pro $VERSION is on Packagist"
              exit 0
            fi
            sleep 30
          done
          echo "::error::surveyjs/surveyjs-pro $VERSION did not appear on Packagist within 20 minutes"
          exit 1
